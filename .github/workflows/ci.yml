name: CI

# Pull-request quality gate: typecheck, lint, tests (Node + Cloudflare/Miniflare),
# and a production build. Runs on PRs and on pushes to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Installs workspace deps. Build scripts for the allowlisted packages
      # (esbuild, workerd) run here — workerd is required by the Miniflare-backed
      # Cloudflare tests.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Node unit + local integration tests, plus the Cloudflare (D1) integration
      # tests running inside Miniflare/workerd.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
